# Sandbox-specific values for chatbot-api-chart
# Only include values that differ from base or local, or are required for sandbox

replicaCount: 2

image:
  registry: ghcr.io/bouc-io
  repository: application/chatbot/chatbot-api-server
  tag: "1.0.1942105665"
  pullPolicy: IfNotPresent
  # tag will be managed by FluxCD, do not set here

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: chatbot-sandbox.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: chatbot-sandbox-tls
      hosts:
        - chatbot-sandbox.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

## TODO: To remove!!!
postgresql:
  enabled: true
  global:
    ## Security parameters
    ##
    security:
      allowInsecureImages: true # Required now since we move to Bitnami Legacy for now.
  # Ensure bundled PostgreSQL subchart pulls from the Bitnami legacy registry
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.5.0-debian-12-r18
  auth:
    username: ps_chatbot_snbx
    database: ps_chatbot_db_snbx
    # Both the bundled Postgres and the app read from this ESO-managed Secret:
    # Postgres takes the `password` key, the app takes the `DATABASE_URL` key that
    # the ExternalSecret template assembles. Keep username and database in sync
    # with the DSN in infrastructure/external-secrets/externalsecrets/sandbox/.
    existingSecret: boucio-chatbot-db-secret
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password
  architecture: standalone

environment:
  # Environment identity for telemetry labels. ${ENVIRONMENT_ID} is substituted from the
  # manually-created cluster-vars ConfigMap by Flux postBuild (local-config Kustomization).
  ENVIRONMENT_ID: "${ENVIRONMENT_ID}"
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  PORT: 3000
  CORS_ORIGIN: "*.bouc.io"
  DISTILLATION_ENABLED: "true"
  DISTILLATION_SERVICE_URL: "http://memory-distiller-chart.default.svc.cluster.local:80"
  DISTILLATION_TIMEOUT_MS: "120000"
  DISTILLATION_MIN_MESSAGES: "10"
  DISTILLATION_MIN_INTERVAL_MS: "900000"
  DISTILLATION_MAX_MESSAGES: "50"
  ALLOW_SELF_SIGNED_CERTS: "true"
  OLLAMA_BASE_URL: "http://ollama-chart.default.svc.cluster.local:11434"
  OLLAMA_MODEL: "qwen3.5:2b"
  MAX_HISTORY_MESSAGES: "20"
  # Instruction services (GAP 4)
  ADMIN_API_URL: "http://admin-api-chart.default.svc.cluster.local:80"
  PORTAL_API_URL: "http://portal-api-chart.default.svc.cluster.local:80"
  # Memory retrieval
  MEMORY_SERVICE_URL: "http://memory-api-chart.default.svc.cluster.local:80"
  MEMORY_SERVICE_ENABLED: "true"
  MEMORY_SEARCH_LIMIT: "10"

# If using external DB in sandbox, override here
externalDatabase:
  host: ""
  port: 5432
  user: bn_chatbot
  database: bitnami_chatbot
  password: ""
  existingSecret: ""
  existingSecretHostKey: ""
  existingSecretPortKey: ""
  existingSecretUserKey: ""
  existingSecretDatabaseKey: ""
  existingSecretPasswordKey: ""
  annotations: {}
