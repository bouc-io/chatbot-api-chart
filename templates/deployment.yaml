apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chatbot-api-chart.fullname" . }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "chatbot-api-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chatbot-api-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chatbot-api-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with include "chatbot-api-chart.imagePullSecrets" . | fromYamlArray }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chatbot-api-chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "chatbot-api-chart.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              #containerPort: {{ .Values.service.port }}
              containerPort: {{ .Values.environment.PORT }}
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: {{ .Values.environment.LOG_LEVEL | quote }}
            - name: NODE_ENV
              value: {{ .Values.environment.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.environment.PORT | quote }}
            - name: CORS_ORIGIN
              value: {{ .Values.environment.CORS_ORIGIN | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "chatbot-api-chart.dbSecretName" . }}
                  key: DATABASE_URL
            - name: DISTILLATION_ENABLED
              value: {{ .Values.environment.DISTILLATION_ENABLED | quote }}
            - name: DISTILLATION_SERVICE_URL
              value: {{ .Values.environment.DISTILLATION_SERVICE_URL | quote }}
            - name: DISTILLATION_TIMEOUT_MS
              value: {{ .Values.environment.DISTILLATION_TIMEOUT_MS | quote }}
            - name: DISTILLATION_MIN_MESSAGES
              value: {{ .Values.environment.DISTILLATION_MIN_MESSAGES | quote }}
            - name: DISTILLATION_MIN_INTERVAL_MS
              value: {{ .Values.environment.DISTILLATION_MIN_INTERVAL_MS | quote }}
            - name: DISTILLATION_MAX_MESSAGES
              value: {{ .Values.environment.DISTILLATION_MAX_MESSAGES | quote }}
            - name: ALLOW_SELF_SIGNED_CERTS
              value: {{ .Values.environment.ALLOW_SELF_SIGNED_CERTS | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.environment.OLLAMA_BASE_URL | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.environment.OLLAMA_MODEL | quote }}
            - name: MAX_HISTORY_MESSAGES
              value: {{ .Values.environment.MAX_HISTORY_MESSAGES | quote }}
            - name: OLLAMA_SYSTEM_PROMPT
              value: {{ .Values.environment.OLLAMA_SYSTEM_PROMPT | quote }}
            - name: OLLAMA_THINK
              value: {{ .Values.environment.OLLAMA_THINK | quote }}
            # Instruction services (GAP 4)
            - name: ADMIN_API_URL
              value: {{ .Values.environment.ADMIN_API_URL | quote }}
            - name: PORTAL_API_URL
              value: {{ .Values.environment.PORTAL_API_URL | quote }}
            # Memory retrieval
            - name: MEMORY_SERVICE_URL
              value: {{ .Values.environment.MEMORY_SERVICE_URL | quote }}
            - name: MEMORY_SERVICE_ENABLED
              value: {{ .Values.environment.MEMORY_SERVICE_ENABLED | quote }}
            - name: MEMORY_SEARCH_LIMIT
              value: {{ .Values.environment.MEMORY_SEARCH_LIMIT | quote }}
            # OpenTelemetry — OTLP traces + metrics to the node-local collector.
            # The collector is a hostNetwork daemonset listening on every node, so it
            # is reached via the node IP (downward API), NOT a ClusterIP service.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.environment.OTEL_SERVICE_NAME | quote }}
            # Stamped on direct-scraped /metrics so they line up with the collector-routed
            # otel_* series. Sourced from the cluster-vars ConfigMap via the HelmRelease.
            - name: ENVIRONMENT_ID
              value: {{ .Values.environment.ENVIRONMENT_ID | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
